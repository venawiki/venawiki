name: 위키 배포

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 위키 도구 설치
        run: pip install -r requirements.txt

      - name: 위키 만들기
        run: mkdocs build --strict

      - name: GitHub Pages 준비
        uses: actions/configure-pages@v5

      - name: 완성된 위키 올리기
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages에 공개
        id: deployment
        uses: actions/deploy-pages@v4
